<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pôle ARE - Organigramme Collaboratif V2.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00738c;
            --accent-color: #e67e22;
            --secondary-bg: #f4f7f8;
            --text-dark: #333;
            --font-apex: 'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-apex);
            background-color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            color: var(--text-dark);
        }

        header { text-align: center; margin-bottom: 50px; }
        h1 { color: var(--primary-color); font-size: 2rem; text-transform: uppercase; letter-spacing: 1px; }

        .search-wrapper { max-width: 500px; margin: 0 auto 50px auto; }
        #skillSearch { width: 100%; padding: 15px 25px; border: 2px solid #e0e0e0; border-radius: 30px; font-size: 1rem; transition: border-color 0.3s; }

        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
        .service-column { background: var(--secondary-bg); border-radius: 15px; padding: 20px; text-align: center; }
        .service-title { font-size: 0.85rem; color: var(--primary-color); font-weight: 700; min-height: 60px; margin-bottom: 30px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }

        .member-item { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; cursor: pointer; transition: transform 0.2s; }
        .member-item:hover { transform: translateY(-5px); }
        .avatar-circle { width: 70px; height: 70px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .name { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .role { font-size: 0.75rem; color: #666; line-height: 1.2; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; }
        .modal-content { background: white; width: 90%; max-width: 750px; margin: 50px auto; padding: 35px; border-radius: 20px; position: relative; max-height: 85vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 28px; cursor: pointer; color: #999; }

        .birthday-row { font-size: 0.85rem; color: #e67e22; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .info-item { padding: 12px; background: #fcfcfc; border-left: 4px solid var(--primary-color); border-radius: 4px; }
        .info-item.rush { border-left-color: var(--accent-color); background: #fffaf5; }
        .info-item label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--primary-color); text-transform: uppercase; margin-bottom: 6px; }
        .info-item.rush label { color: var(--accent-color); }
        .info-item span { font-size: 0.85rem; color: #444; white-space: pre-line; }
        .empty-note { font-style: italic; color: #aaa; font-size: 0.75rem; }

        @media (max-width: 1100px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 650px) { .grid-container { grid-template-columns: 1fr; } .info-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>Pôle Accompagnement à la Réussite Étudiante</h1>
    <p>Responsable de Pôle : Camille HERITIER</p>
</header>

<div class="search-wrapper">
    <input type="text" id="skillSearch" placeholder="Chercher un nom, un projet, une expertise..." onkeyup="filterData()">
</div>

<div class="grid-container">
    <div class="service-column"><div class="service-title">Orientation, Insertion Pro et Accompagnement</div><div id="col-orientation"></div></div>
    <div class="service-column"><div class="service-title">Relations partenaires</div><div id="col-relations"></div></div>
    <div class="service-column"><div class="service-title">Développement Dispositifs (3DR)</div><div id="col-3dr"></div></div>
    <div class="service-column"><div class="service-title">Laboratoire de la réussite</div><div id="col-labo"></div></div>
</div>

<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="m-name" style="color: var(--primary-color); margin: 0 0 5px 0;"></h2>
        <p id="m-role-top" style="font-weight: bold; color: #666; margin-bottom: 5px;"></p>
        
        <div id="m-bday-container" class="birthday-row">
            🎂 Jour d'anniversaire : <span id="m-bday"></span>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee;">
        
        <div class="info-grid">
            <div class="info-item"><label>Périmètre d’action</label><span id="m-perimetre"></span></div>
            <div class="info-item"><label>Expertise</label><span id="m-skills"></span></div>
            <div class="info-item"><label>Projets en cours (deadline)</label><span id="m-projects"></span></div>
            <div class="info-item"><label>Interactions-clés</label><span id="m-interactions"></span></div>
            <div class="info-item"><label>Collaboration idéale</label><span id="m-collab"></span></div>
            <div class="info-item"><label>Préférence de communication</label><span id="m-comm"></span></div>
            <div class="info-item rush"><label>Temps chauds / Périodes de rush</label><span id="m-rush"></span></div>
            <div class="info-item"><label>Trait particulier / fun</label><span id="m-fun"></span></div>
        </div>
    </div>
</div>

<script>
    const team = [
        { name: "Fred MEERPOËL", col: "orientation", role: "Responsable", bday: "" },
        { name: "Joëlle GOUDINEAU", col: "orientation", role: "Conseillère Orientation Psychologue", bday: "" },
        { name: "Delphine ISCAYE", col: "orientation", role: "Conseillère ARE", bday: "" },
        { name: "Corinne MARGUTTI", col: "orientation", role: "Conseillère ARE", bday: "" },
        { name: "Nicolas MUSCAT", col: "orientation", role: "Conseiller ARE", bday: "" },
        { name: "Elodie RODRIGUEZ", col: "orientation", role: "Conseillère ARE", bday: "" },
        { name: "Virginie BADAMO", col: "orientation", role: "Conseillère ARE", bday: "" },
        { name: "Jade JANNINELLE", col: "relations", role: "Chargée de relations - Secondaire", bday: "" },
        { name: "Nina GAULUPEAU", col: "relations", role: "Animateur Communauté Étudiants", bday: "" },
        { name: "Céline CHAUVE", col: "3dr", role: "Responsable de Service", bday: "" },
        { name: "Igor CARRÉ", col: "3dr", role: "Chargé de développement", bday: "" },
        { name: "Létitia COQUET", col: "3dr", role: "Chargée de développement", bday: "" },
        { name: "Stéphanie LITTERST", col: "3dr", role: "Responsable Cellule PPO", bday: "" },
        { name: "Béatrice RENARD", col: "3dr", role: "Coordonnatrice Formation", bday: "" },
        { 
            name: "Sarah SAIOUD", 
            col: "labo", 
            role: "Responsable Labo de la Réussite", 
            bday: "24 septembre",
            perimetre: "Conception et expérimentation d’outils et d’actions innovantes pour améliorer l’expérience et la réussite des étudiants",
            skills: "Outils : Canva, Genially, Moodle, H5P, Syllabus, Apose\nMéthodes : UX Design, Design Thinking, Ingénierie pédago",
            projects: "Maintenance Passeport, Refonte Promo (09/26), Ateliers rentrée (09/26), GT Orientation (09/26), Boîte réussite (09/27)",
            interactions: "• Stratégie, validation et coordination générale : Camille\n• Analyses des questionnaires du Passeport : M.C. de Cian, H. Crovello, I. Carré\n• Technique : Équipe 3DR (Moodle)\n• Terrain : Soiparé & Étudiants\n• RH Étudiants : Nina",
            collab: "Besoin d'un récap écrit si échange oral",
            comm: "Teams ou Email",
            rush: "Septembre-Octobre (Rentrée)\nTélétravail : Lundi & Vendredi",
            fun: "Fan de Harry Potter"
        },
        { name: "Christophe GARELLI", col: "labo", role: "Chargé outils innovants", bday: "" }
    ];

    function renderTeam(filteredData) {
        const columns = ['orientation', 'relations', '3dr', 'labo'];
        columns.forEach(c => document.getElementById(`col-${c}`).innerHTML = '');
        filteredData.forEach(member => {
            const initials = member.name.split(' ').map(n => n[0]).join('');
            const card = document.createElement('div');
            card.className = 'member-item';
            card.onclick = () => openModal(member);
            card.innerHTML = `<div class="avatar-circle">${initials}</div><div class="name">${member.name}</div><div class="role">${member.role}</div>`;
            document.getElementById(`col-${member.col}`).appendChild(card);
        });
    }

    function openModal(m) {
        document.getElementById('m-name').innerText = m.name;
        document.getElementById('m-role-top').innerText = m.role;
        
        if(m.bday) {
            document.getElementById('m-bday-container').style.display = 'flex';
            document.getElementById('m-bday').innerText = m.bday;
        } else {
            document.getElementById('m-bday-container').style.display = 'none';
        }

        document.getElementById('m-perimetre').innerHTML = m.perimetre || '<span class="empty-note">Missions principales</span>';
        document.getElementById('m-skills').innerHTML = m.skills || '<span class="empty-note">Outils et compétences clés</span>';
        document.getElementById('m-projects').innerHTML = m.projects || '<span class="empty-note">Dossiers actuels</span>';
        
        // Texte d'exemple pour le Maillage pour guider l'équipe
        document.getElementById('m-interactions').innerHTML = m.interactions || '<span class="empty-note">Regrouper par thématique (ex: Scolarité, Com...) plutôt que par noms individuels.</span>';
        
        document.getElementById('m-collab').innerHTML = m.collab || '<span class="empty-note">Besoins spécifiques</span>';
        document.getElementById('m-comm').innerHTML = m.comm || '<span class="empty-note">Canaux favoris</span>';
        document.getElementById('m-rush').innerHTML = m.rush || '<span class="empty-note">Ex: Rentrée, Réos...</span>';
        document.getElementById('m-fun').innerHTML = m.fun || '<span class="empty-note">-</span>';
        
        document.getElementById('infoModal').style.display = 'block';
    }

    function closeModal() { document.getElementById('infoModal').style.display = 'none'; }

    function filterData() {
        const val = document.getElementById('skillSearch').value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 
        const filtered = team.filter(m => {
            const allText = `${m.name} ${m.role} ${m.skills || ''} ${m.perimetre || ''} ${m.projects || ''} ${m.rush || ''}`.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            return allText.includes(val);
        });
        renderTeam(filtered);
    }

    window.onclick = (e) => { if(e.target.className === 'modal') closeModal(); }
    renderTeam(team);
</script>

</body>
</html>
